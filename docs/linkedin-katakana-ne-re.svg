<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-label="Can you tell ネ from レ">
  <rect width="1080" height="1080" fill="#fff9ef"/>

  <text x="540" y="90" text-anchor="middle" font-family="Lato, Outfit, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" letter-spacing="7.2" fill="#6a5c4e">JAPANESE ESSENTIAL</text>
  <text y="176" fill="#1d3550" font-weight="700">
    <tspan x="295.5" font-family="Liberation Serif, serif" font-size="48">Can you tell </tspan>
    <tspan font-family="Noto Serif CJK JP, Noto Serif CJK KR, serif" font-size="52">ネ</tspan>
    <tspan font-family="Liberation Serif, serif" font-size="48"> from </tspan>
    <tspan font-family="Noto Serif CJK JP, Noto Serif CJK KR, serif" font-size="52">レ</tspan>
  </text>
  <text y="236" fill="#6a5c4e">
    <tspan x="347.5" font-family="Liberation Serif, serif" font-size="28">Example: </tspan>
    <tspan font-family="Noto Serif CJK JP, Noto Serif CJK KR, serif" font-size="30">ネックレス</tspan>
    <tspan font-family="Liberation Serif, serif" font-size="28"> (necklace)</tspan>
  </text>

  <rect x="56" y="278" width="968" height="652" fill="#fff9ef" stroke="#1d3550" stroke-width="2"/>
  <rect x="540" y="278" width="484" height="652" fill="#1d3550" fill-opacity="0.045"/>
  <line x1="540" y1="278" x2="540" y2="930" stroke="#1d3550" stroke-width="2"/>

  <text x="298.0" y="500" text-anchor="middle" dominant-baseline="central" font-family="Noto Serif CJK JP, Noto Serif CJK KR, serif" font-size="188" fill="#1d3550">ネ</text>
  <text x="782.0" y="500" text-anchor="middle" dominant-baseline="central" font-family="Noto Serif CJK JP, Noto Serif CJK KR, serif" font-size="188" fill="#1d3550">レ</text>
  <text x="298.0" y="700" text-anchor="middle" dominant-baseline="central" font-family="Noto Serif CJK JP, Noto Serif CJK KR, serif" font-size="84" fill="#1d3550">ね</text>
  <text x="782.0" y="700" text-anchor="middle" dominant-baseline="central" font-family="Noto Serif CJK JP, Noto Serif CJK KR, serif" font-size="84" fill="#1d3550">れ</text>

  <rect x="265" y="806" width="37" height="31" fill="#1d3550"/>
  <rect x="751" y="806" width="32" height="31" fill="#1d3550"/>
  <text x="271" y="832" font-family="Liberation Serif, serif" font-size="44" font-weight="700" fill="#fff9ef">n</text>
  <text x="305" y="832" font-family="Liberation Serif, serif" font-size="44" font-weight="700" fill="#1d3550">e</text>
  <text x="757" y="832" font-family="Liberation Serif, serif" font-size="44" font-weight="700" fill="#fff9ef">r</text>
  <text x="787" y="832" font-family="Liberation Serif, serif" font-size="44" font-weight="700" fill="#1d3550">e</text>

  <text x="540" y="998" text-anchor="middle" font-family="Noto Serif CJK KR, Liberation Serif, serif" font-size="20" fill="#6a5c4e">© 수영 책방 Swimming Bookstore</text>
</svg>
